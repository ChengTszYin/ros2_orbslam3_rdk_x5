%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "Rectified"

# Left Camera (Camera1) calibration
Camera1.fx: 450.0          # Approximate - replace with your calibration
Camera1.fy: 450.0
Camera1.cx: 320.0
Camera1.cy: 200.0

# Distortion (usually near zero after rectification)
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Stereo baseline (OAK-D-Lite is approximately 7.5 cm)
Stereo.b: 0.075

# Camera resolution (common for OAK-D-Lite mono cameras)
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20

# Color order (0: BGR, 1: RGB)
Camera.RGB: 1

# Close/Far threshold
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7
ORBextractor.type: "ORB"

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0